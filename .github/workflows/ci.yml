name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Severity tests
        run: node --test plugin/office/severity.test.mjs
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Built UI is committed
        run: git diff --exit-code -- plugin/ui || (echo "Run 'cd app && npm run build' and commit plugin/ui" && exit 1)
      - name: Server smoke test
        run: |
          node plugin/office/ctl.mjs start "$PWD"
          curl -fsS http://127.0.0.1:4777/health
          curl -fsS http://127.0.0.1:4777/ | grep -q '<div id="root">'
          node plugin/office/ctl.mjs stop
